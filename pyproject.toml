[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlocalc"
version = "0.3.0"
description = "Quasi-phase-matched nonlinear optics calculator: Sellmeier models, QPM design, SHG/DFG conversion and OSA spectrum simulation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nlocalc = "nlocalc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
